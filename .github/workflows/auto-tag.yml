name: Auto-Tag on Version Bump

# ─────────────────────────────────────────────────────────────────────────────
# Watches CMakeLists.txt on every push to main.
# If the version declared in CMakeLists.txt is not yet a git tag, it creates
# and pushes the tag automatically, which then fires the release workflow.
#
# This means your tagging process is:
#   1. Edit the VERSION field in CMakeLists.txt  (e.g. 0.1.0 → 0.2.0)
#   2. Update CHANGELOG.md with the new version section
#   3. git commit && git push origin main
#   → This workflow detects the bump and pushes tag v0.2.0
#   → The release.yml workflow fires and creates the GitHub Release
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ "main" ]
    paths:
      - "CMakeLists.txt"   # only run when CMakeLists.txt changes

jobs:
  auto-tag:
    name: Tag if version changed
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the tag

    steps:
    - name: Checkout (full history for tag check)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Read version from CMakeLists.txt
      id: version
      run: |
        # Extract the VERSION line from project(...) block
        VERSION=$(grep -E '^\s+VERSION\s+[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt \
                  | head -1 \
                  | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "Detected version: $VERSION"
        echo "value=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION"  >> "$GITHUB_OUTPUT"

    - name: Check if tag already exists
      id: tag_check
      run: |
        TAG="${{ steps.version.outputs.tag }}"
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG already exists — skipping."
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG does not exist — will create."
        fi

    - name: Create and push tag
      if: steps.tag_check.outputs.exists == 'false'
      run: |
        TAG="${{ steps.version.outputs.tag }}"
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"
        echo "✅ Pushed tag $TAG — release workflow will now fire."
